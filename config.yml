baseURL: "https://deniskazakov.com/"
languageCode: "en-us,ru-ru"
title: "Denis Kazakov"
theme: "PaperMod"
paginate: 10

enableInlineShortcodes: true
enableRobotsTXT: true
enableEmoji: true

buildDrafts: false
buildFuture: false
buildExpired: false
googleAnalytics: G-T4QXP5ZBSV

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Denis Kazakov"
  description: "Denis Kazakov — backend engineer writing about systems, engineering, and technology."
  keywords: [Denis Kazakov, backend engineering, distributed systems, Python, Go, blog]
  author: ["Denis Kazakov"]
  mainSections: [posts]
#  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  displayFullLangName: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    extended: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/denis-kazakov/"
    - name: github
      url: "https://github.com/KazakovDenis"
    - name: habr
      url: "https://habr.com/ru/users/KazakovDenis/publications/articles/"
    - name: stackoverflow
      url: "https://stackoverflow.com/users/12111071/praetorian"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

#  editPost:
#    URL: "https://github.com/KazakovDenis/KazakovDenis.github.io/content"
#    Text: "Suggest Changes" # edit text
#    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON # is necessary

languages:
  en:
    languageName: ":gb:"
    weight: 1
    params:
      label:
        text: "Home"
      homeInfoParams:
        Title: "Denis Kazakov"
        Content: "Backend engineer. I write about distributed systems, performance, and the craft of building software."
    menu:
      main:
        - name: Posts
          url: posts/
          weight: 10
        - name: About
          url: about/
          weight: 20

  ru:
    languageName: ":ru:"
    weight: 2
    title: "Денис Казаков"
    params:
      languageAltTitle: Русский
      label:
        text: "Главная"
      homeInfoParams:
        Title: "Денис Казаков"
        Content: "Backend-разработчик. Пишу о распределённых системах, производительности и инженерном подходе к разработке."
    menu:
      main:
        - name: Публикации
          url: posts/
          weight: 10
        - name: Обо мне
          url: about/
          weight: 20
